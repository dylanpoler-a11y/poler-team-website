<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Landing-Page A/B — Live</title>
<style>
  :root{
    --navy:#1a2744; --navy-light:#243656; --bg:#f8f9fb; --card:#ffffff;
    --muted:#718096; --line:#e6e9ef; --green:#1f9d55; --amber:#b7791f; --red:#c0392b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--navy);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:28px 18px 60px}
  h1{font-family:"Playfair Display",Georgia,serif;font-size:24px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .verdict{background:var(--navy);color:#fff;border-radius:12px;padding:16px 18px;font-size:15px;font-weight:600;margin-bottom:8px}
  .meta{color:var(--muted);font-size:12px;margin-bottom:20px}
  .arms{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.arms{grid-template-columns:1fr}}
  .arm{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
  .arm.win{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
  .arm h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 0 10px}
  .big{font-size:34px;font-weight:800;line-height:1}
  .big small{font-size:14px;font-weight:600;color:var(--muted)}
  .row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-top:1px solid var(--line);color:#3a4762}
  .row span:last-child{font-weight:700;color:var(--navy)}
  .bar{height:6px;background:var(--line);border-radius:6px;margin-top:12px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--navy)}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;margin-top:10px}
  .b-collect{background:#eef1f6;color:var(--muted)}
  .b-sig{background:#e6f6ec;color:var(--green)}
  .b-nosig{background:#fdf2e2;color:var(--amber)}
  h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:30px 0 8px}
  table{width:100%;border-collapse:collapse;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  th{background:#f1f3f8;color:var(--muted);font-weight:600}
  .err{color:var(--red);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>Landing-Page A/B — Live</h1>
  <div class="sub">/listing popup · cold-ad conversion test · auto-refresh 20s</div>
  <div id="verdict" class="verdict">Loading…</div>
  <div id="meta" class="meta"></div>
  <div class="arms">
    <div class="arm" id="armA"><h2 id="armA-h">A — champion</h2><div class="big" id="convA">–<small>%</small></div><div id="rowsA"></div><div class="bar"><i id="barA" style="width:0"></i></div><div id="badgeA"></div></div>
    <div class="arm" id="armB"><h2 id="armB-h">B — challenger</h2><div class="big" id="convB">–<small>%</small></div><div id="rowsB"></div><div class="bar"><i id="barB" style="width:0"></i></div><div id="badgeB"></div></div>
  </div>
  <h3>Round history</h3>
  <table id="hist"><thead><tr><th>Round</th><th>Winner</th><th>A conv</th><th>B conv</th><th>p</th><th>Note</th></tr></thead><tbody><tr><td colspan="6" style="color:#718096">No completed rounds yet.</td></tr></tbody></table>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  function rows(el, agg, threshold){
    if(!agg){ el.innerHTML = '<div class="row"><span>No data</span><span>–</span></div>'; return; }
    el.innerHTML = [
      ['Visitors', agg.viewers],
      ['Leads', agg.leads],
      ['Median time', agg.medianDwellSec ? agg.medianDwellSec + 's' : '–'],
      ['Reached form', (agg.scrollToFormPct||0) + '%'],
    ].map(([k,v]) => `<div class="row"><span>${k}</span><span>${v}</span></div>`).join('');
  }
  function badge(el, agg, threshold, pValue, hasB){
    if(!hasB || !agg){ el.innerHTML=''; return; }
    if(agg.viewers < threshold){ el.innerHTML = `<span class="badge b-collect">collecting ${agg.viewers}/${threshold}</span>`; return; }
    if(pValue < 0.05){ el.innerHTML = `<span class="badge b-sig">significant</span>`; return; }
    el.innerHTML = `<span class="badge b-nosig">no sig. yet</span>`;
  }
  async function tick(){
    try{
      const r = await fetch('/api/lp-ab/report', {cache:'no-store'});
      const d = await r.json();
      if(d.error){ $('verdict').innerHTML = '<span class="err">Error: '+d.error+'</span>'; return; }
      $('verdict').textContent = d.verdict || '—';
      $('meta').textContent = `Round ${d.round} · status ${d.status} · split ${d.split}% to B · threshold ${d.threshold}/arm`
        + (d.lift!=null ? ` · B lift ${d.lift>0?'+':''}${d.lift}%` : '') + ` · updated ${new Date(d.updatedAt).toLocaleTimeString()}`;
      $('armA-h').textContent = `A — champion (${d.champion})`;
      $('armB-h').textContent = d.challenger ? `B — challenger (${d.challenger})` : 'B — (no challenger)';
      $('convA').innerHTML = (d.a ? d.a.convRate : 0) + '<small>%</small>';
      $('convB').innerHTML = (d.b ? d.b.convRate : 0) + '<small>%</small>';
      rows($('rowsA'), d.a, d.threshold); rows($('rowsB'), d.b, d.threshold);
      const win = d.b && d.pValue < 0.05;
      $('armA').classList.toggle('win', win && d.a.convRate >= d.b.convRate);
      $('armB').classList.toggle('win', win && d.b.convRate > d.a.convRate);
      $('barA').style.width = Math.min(100, 100*(d.a?d.a.viewers:0)/(d.threshold||1)) + '%';
      $('barB').style.width = Math.min(100, 100*(d.b?d.b.viewers:0)/(d.threshold||1)) + '%';
      badge($('badgeA'), d.a, d.threshold, d.pValue, !!d.b);
      badge($('badgeB'), d.b, d.threshold, d.pValue, !!d.b);
      const tb = $('hist').querySelector('tbody');
      if(d.history && d.history.length){
        tb.innerHTML = d.history.map(h => `<tr><td>${h.round}</td><td><b>${h.winner}</b></td><td>${h.a?h.a.convRate:'–'}%</td><td>${h.b?h.b.convRate:'–'}%</td><td>${h.pValue??'–'}</td><td>${h.reason||''}</td></tr>`).join('');
      }
    }catch(e){ $('verdict').innerHTML = '<span class="err">'+e.message+'</span>'; }
  }
  tick(); setInterval(tick, 20000);
</script>
</body>
</html>
