<!-- FILTER BAR (sticky) -->
<section class="pc-filterbar" id="pc-filterbar">
    <div class="pc-filter-inner">
        <div class="pc-filter-group pc-filter-area" id="pc-area-group">
            <span class="pc-filter-label" data-i18n="fArea">Area</span>
            <div class="pc-area-chips" id="pc-area-chips"><!-- populated by JS --></div>
        </div>

        <div class="pc-filter-group">
            <label class="pc-filter-label" for="pc-price" data-i18n="fPriceMax">Price max</label>
            <select id="pc-price" class="pc-select">
                <option value="" data-i18n="optAny">Any</option>
                <option value="1000000" data-i18n="opt1M">$1M</option>
                <option value="2000000" data-i18n="opt2M">$2M</option>
                <option value="3000000" data-i18n="opt3M">$3M</option>
                <option value="5000000" data-i18n="opt5M">$5M</option>
                <option value="10000000" data-i18n="opt10M">$10M</option>
                <option value="20000000" data-i18n="opt20M">$20M+</option>
            </select>
        </div>

        <div class="pc-filter-group">
            <label class="pc-filter-label" for="pc-delivery" data-i18n="fDelivery">Delivery by</label>
            <select id="pc-delivery" class="pc-select">
                <option value="" data-i18n="optAny">Any</option>
                <option value="2026">2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
                <option value="2029">2029</option>
                <option value="2031">2031</option>
            </select>
        </div>

        <div class="pc-filter-group">
            <label class="pc-filter-label" for="pc-beds" data-i18n="fBeds">Bedrooms min</label>
            <select id="pc-beds" class="pc-select">
                <option value="" data-i18n="optAny">Any</option>
                <option value="1" data-i18n="opt1plus">1+</option>
                <option value="2" data-i18n="opt2plus">2+</option>
                <option value="3" data-i18n="opt3plus">3+</option>
                <option value="4" data-i18n="opt4plus">4+</option>
            </select>
        </div>

        <div class="pc-filter-group">
            <label class="pc-filter-label" for="pc-sort" data-i18n="fSort">Sort</label>
            <select id="pc-sort" class="pc-select">
                <option value="price_low" data-i18n="sortPriceLow">Price: low → high</option>
                <option value="price_high" data-i18n="sortPriceHigh">Price: high → low</option>
                <option value="delivery" data-i18n="sortDelivery">Soonest delivery</option>
                <option value="name" data-i18n="sortName">Name</option>
            </select>
        </div>

        <div class="pc-filter-checks">
            <label class="pc-check"><input type="checkbox" id="pc-waterfront"><span data-i18n="fWaterfront">Waterfront</span></label>
            <label class="pc-check"><input type="checkbox" id="pc-str"><span data-i18n="fStr">Short-term rental OK</span></label>
        </div>
