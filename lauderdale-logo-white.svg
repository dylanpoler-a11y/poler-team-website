<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <clipPath id="sunclip">
      <rect x="60" y="20" width="280" height="140"/>
    </clipPath>
  </defs>

  <!-- Sunburst rays - white on dark bg -->
  <g clip-path="url(#sunclip)">
    <g transform="translate(200, 160)">
      <polygon points="0,-120 -14,0 14,0" fill="white" transform="rotate(-72)"/>
      <polygon points="0,-120 -14,0 14,0" fill="white" transform="rotate(-54)"/>
      <polygon points="0,-120 -14,0 14,0" fill="white" transform="rotate(-36)"/>
      <polygon points="0,-120 -14,0 14,0" fill="white" transform="rotate(-18)"/>
      <polygon points="0,-120 -14,0 14,0" fill="white" transform="rotate(0)"/>
      <polygon points="0,-120 -14,0 14,0" fill="white" transform="rotate(18)"/>
      <polygon points="0,-120 -14,0 14,0" fill="white" transform="rotate(36)"/>
      <polygon points="0,-120 -14,0 14,0" fill="white" transform="rotate(54)"/>
      <polygon points="0,-120 -14,0 14,0" fill="white" transform="rotate(72)"/>
    </g>
  </g>

  <!-- Island/base shape -->
  <path d="M105,160 Q200,180 295,160 Q255,172 200,175 Q145,172 105,160Z" fill="white"/>

  <!-- Palm trees - white -->
  <g fill="white">
    <!-- Left palm trunk -->
    <path d="M172,160 Q168,130 165,100" stroke="white" stroke-width="4" fill="none"/>
    <!-- Left palm fronds -->
    <path d="M165,100 Q148,86 130,90 Q152,90 165,100Z"/>
    <path d="M165,100 Q153,80 140,75 Q155,82 165,100Z"/>
    <path d="M165,100 Q172,78 182,72 Q173,85 165,100Z"/>
    <path d="M165,100 Q180,86 192,86 Q176,92 165,100Z"/>

    <!-- Right palm trunk -->
    <path d="M228,160 Q230,125 232,95" stroke="white" stroke-width="4" fill="none"/>
    <!-- Right palm fronds -->
    <path d="M232,95 Q218,78 205,76 Q220,80 232,95Z"/>
    <path d="M232,95 Q225,72 218,65 Q228,75 232,95Z"/>
    <path d="M232,95 Q242,72 252,68 Q244,80 232,95Z"/>
    <path d="M232,95 Q250,82 262,82 Q248,88 232,95Z"/>
  </g>

  <!-- Book/open pages at bottom -->
  <path d="M115,163 Q157,153 200,157 Q243,153 285,163 L285,173 Q243,163 200,167 Q157,163 115,173Z" fill="white" opacity="0.8"/>

  <!-- THE LAUDERDALE text - white -->
  <text x="200" y="218" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="32" fill="white" letter-spacing="3">THE LAUDERDALE</text>

  <!-- BOUTIQUE HOTEL & SUITES text - teal accent -->
  <text x="200" y="248" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="15" fill="#4ABFAD" letter-spacing="4">BOUTIQUE HOTEL &amp; SUITES</text>
</svg>
