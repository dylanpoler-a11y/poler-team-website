<body>
<canvas id="stage"></canvas>

<div id="loading"><div class="spinner"></div><p>Loading the house…</p></div>

<header id="bar">
  <div class="title"><strong>1015 Stillwater Dr</strong><span>Golden Beach</span><a class="furnished-model-link" href="/1015stillwater/design">Furnished model ↗</a></div>
  <div class="modes" role="group" aria-label="View mode">
    <button id="mode-walk" class="on" type="button">Walk inside</button>
    <button id="mode-orbit" type="button">See the whole house</button>
  </div>
</header>

<nav id="levels" aria-label="Floor"></nav>
<nav id="places" aria-label="Jump to a room"></nav>

<div id="hint"><span class="desktop">Drag to look · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move · <kbd>Shift</kbd> to hurry</span><span class="touch">Drag to look · tap the floor to walk there</span></div>
<div id="vert" hidden><button id="go-up" type="button" hidden>Go up</button><button id="go-down" type="button" hidden>Go down</button></div>
<div id="room" aria-live="polite"></div>
<button id="recenter" type="button" hidden>Put me back inside</button>

<script type="module" src="app.js"></script>
</body>
